
name: Java Maven自动化测试

on:
  push:
    branches: [main]
    paths:
      - 'java-demo/**'
      - '.github/workflows/java-ci.yml'

  pull_request:
    branches: [main]
    paths:
      - 'java-demo/**'
      - '.github/workflows/java-ci.yml'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java-demo/pom.xml

      - name: 运行Maven测试
        working-directory: java-demo
        run: mvn -B test
